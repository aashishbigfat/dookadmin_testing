# adm.dook.bigfat.ai -- nginx server block
#
# THIS FILE DOES NOT BELONG TO THIS REPO'S RUNTIME. It is kept here because
# deploying dookadmin depends on it, and the dependency is otherwise invisible
# from this side.
#
# Append it to:   dooksite_testing -> docker/nginx.conf
# (that file is copied into dookwebsite's image at /etc/nginx/sites-enabled/default)
#
# WHY IT IS NEEDED
# dookwebsite's nginx owns host 443 and has exactly one `listen 443` block,
# server_name dook.bigfat.ai. Being the only one it is also the DEFAULT for
# 443, so https://adm.dook.bigfat.ai/ is answered with dook.bigfat.ai's
# certificate and the browser refuses the connection. That is the entire
# reason the admin panel does not open.
#
# ALREADY DONE (2026-09-29)
#   - DNS: adm.dook.bigfat.ai -> 34.14.138.54
#   - TLS: certbot cert issued on the VM host, expires 2026-12-28, auto-renews
#          /etc/letsencrypt/live/adm.dook.bigfat.ai/
#   - Network: dookadmin-app-1 attached to dookwebsite_default, so
#              http://dookadmin-app-1:8002/login answers 200 from inside
#              dookwebsite-app-1
#
# STILL TO DO: add this block and reload nginx.
#

# --- dookadmin (adm.dook.bigfat.ai) --------------------------------------
#
# The Laravel admin panel, running as a THIRD container on this VM. This
# block exists because nginx here owns 443: without it adm.dook.bigfat.ai
# falls through to the dook.bigfat.ai block above (the only 443 server, so
# also the default), which answers with dook.bigfat.ai's certificate and the
# browser refuses to connect.
#
# proxy_pass targets the CONTAINER NAME, not 127.0.0.1. dookadmin publishes
# 8002 on the VM host, but inside this container 127.0.0.1 is this container
# - the host's loopback is not visible here. The dookadmin stack attaches
# itself to dookwebsite_default (see its docker-compose.prod.yml) so Docker's
# embedded DNS resolves this name.
#
# Unlike dookblog, dookadmin does NOT share this container's network
# namespace; it keeps its own port space, so a bind clash there cannot
# silently serve the wrong application.
#
# Note: nginx resolves this name once at startup. If the dookadmin container
# is recreated with a new IP, reload nginx here.
#
# TLS terminates here, as it does for dook.bigfat.ai - separate certificate,
# same certbot on the VM host, same bind-mounted /etc/letsencrypt.
server {
    listen 443 ssl;
    server_name adm.dook.bigfat.ai;

    ssl_certificate     /etc/letsencrypt/live/adm.dook.bigfat.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adm.dook.bigfat.ai/privkey.pem;

    # Matches upload_max_filesize / post_max_size in the dookadmin image.
    # Smaller than that here and large image uploads fail at the proxy with a
    # 413 before PHP ever sees them.
    client_max_body_size 128M;

    location / {
        proxy_pass http://dookadmin-app-1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # dookadmin's TrustProxies is '*', so it takes the real scheme from
        # here. Without this it would build http:// URLs on an https page.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # PDF generation is the slow path in that app; its own php.ini allows
        # 300s and PdfController raises further with ini_set().
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
