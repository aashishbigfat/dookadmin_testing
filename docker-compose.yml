# Local development only.
#
# Production runs this same image as the third container on the Compute Engine
# VM alongside dookwebsite and dookblog -- see the header of ./Dockerfile for
# the port allocation and why it matters. The image serves on 8002; this file
# only maps it somewhere convenient on the host.

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      # Host side is overridable: APP_PORT=8090 docker compose up
      - "${APP_PORT:-8002}:8002"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8002}
      # Generate once with: php artisan key:generate --show
      APP_KEY: ${APP_KEY:?set APP_KEY in .env or the environment}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: dookweb
      DB_USERNAME: dook
      DB_PASSWORD: secret

      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync

      # The images moved to Cloud Storage on 28 Sep 2026 and the image ships
      # without public/dook/, so the legacy layout would 404 every package and
      # POI image. See explainers/images_gcp.md.
      IMAGE_LAYOUT: gcs
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://storage.googleapis.com/dook-images-prod}
    volumes:
      # Local copies of the content images, so legacy paths still resolve while
      # developing. Read-only: the bucket is the source of truth.
      - ./public/dook:/var/www/html/public/dook:ro
      # To exercise Cloud Storage locally, run `gcloud auth application-default
      # login`, then uncomment and add GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      #   - ${APPDATA}/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: dookweb
      MYSQL_USER: dook
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "${DB_PORT_HOST:-33061}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
